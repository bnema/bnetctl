name: release

on:
  push:
    tags: ['v*']

# Default to no token permissions; release alone needs release writes.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.server_url != 'https://github.com'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    # Releases are published by ermite (git.bnema.dev); the GitHub mirror
    # receives the tags but must not publish a second release or AUR push.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SSH key for the bnetctl-bin AUR push.
          AUR_KEY: ${{ secrets.AUR_KEY }}

  aur:
    needs: release
    if: github.server_url != 'https://github.com' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git openssh sudo
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create the build user
        run: |
          useradd -m builder
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' >/etc/sudoers.d/builder
      - name: Build and publish bnetctl-git
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo -u builder --preserve-env=AUR_KEY \
            packaging/aur/publish.sh packaging/aur/bnetctl-git/PKGBUILD
