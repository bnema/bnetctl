name: release

on:
  push:
    tags: ['v*']

# Default to no token permissions; release alone needs release writes.
permissions: {}

jobs:
  release:
    # Releases are published by ermite (git.bnema.dev); the GitHub mirror
    # receives the tags but must not publish a second release or AUR push.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SSH key for the bnetctl-bin AUR push.
          AUR_KEY: ${{ secrets.AUR_KEY }}
